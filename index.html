<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Soạn ký tự và tạo hướng dẫn spell cho Casio fx-580VN X.">
<title>Spell Studio · fx-580VN X</title>
<link rel="stylesheet" href="style.css?v=palette-font-1">
<link rel="stylesheet" href="motion.css?v=layout-readable-1">
<script defer src="data.js"></script><script defer src="pdf-reference.js"></script><script defer src="engine.js?v=preview-fhex-1"></script><script defer src="motion.js"></script><script defer src="palette-font.js?v=1"></script><script defer src="app.js?v=palette-font-1"></script>
</head>
<body>
<svg class="glyph-defs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false"><defs><filter id="spell-preview-ink" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .14  0 0 0 0 .18  0 0 0 0 .12  1.0714285714 0 0 0 -.0714285714"/></filter></defs></svg>
<div class="motion-backdrop" aria-hidden="true"><span></span><span></span></div>
<header class="topbar"><a class="brand" href="#" aria-label="Spell Studio"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="logo-stroke" pathLength="1" d="M22 8H12a5 5 0 0 0 0 10h4a4 4 0 0 1 0 8H6"/><path class="logo-cursor" d="M22 26h6"/></svg></span><span><span class="brand-word">spell</span><span class="brand-light">studio</span></span></a><div class="top-right"><button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="true" aria-label="Hiệu ứng chuyển động"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10h3l3-6 4 12 3-6h3"/></svg><span>Hiệu ứng</span><i aria-hidden="true"></i></button><span class="model"><i></i> fx-580VN X</span><a href="casio-spell-web.zip" download>Mã nguồn ↗</a></div></header>
<main class="workspace">
<section class="composer card" aria-label="Soạn văn bản">
<div class="section-top"><h1>Văn bản spell</h1><button id="clear" class="text-button">Xóa hết</button></div>
<label class="sr-only" for="editor">Nội dung cần spell</label><textarea aria-describedby="error" id="editor" rows="2" spellcheck="false" placeholder="Gõ văn bản hoặc chọn ký tự…">ChatGPT</textarea>
<div class="editor-options"><label class="toggle" for="center">Căn giữa: <input id="center" type="checkbox" checked></label><div class="examples"><button data-example="ChatGPT">ChatGPT</button><button data-example="Việt Nam">Việt Nam</button></div></div>
<div class="preview-wrap"><div id="preview" class="spell-line" role="img" aria-label="Chữ sẽ spell"></div></div>
<div id="error" class="error" role="alert" hidden></div>
<button id="generate" class="primary"><span class="button-label">Tạo hướng dẫn</span><span class="generate-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="generate-arrow" d="M6 18 18 6M6 6h12v12"/><path class="generate-check" pathLength="1" d="m5 12 4 4L19 6"/></svg></span></button>
</section>
<section class="palette card" aria-label="Bảng ký tự Casio">
<div class="section-top"><h2>Bảng ký tự</h2><a class="reference" href="https://cwh.ca510.com/2-level-font/" target="_blank" rel="noopener">Bảng gốc ↗</a></div>
<div class="palette-tools"><div class="tabs" role="group" aria-label="Chọn bảng ký tự"><span id="tab-indicator" class="tab-indicator" aria-hidden="true"></span><button data-group="base" aria-pressed="true" class="active">00</button><button data-group="f0" aria-pressed="false">F0</button><button data-group="f4" aria-pressed="false">F4 · Tiếng Việt</button></div><label class="search"><span>⌕</span><input id="search" type="search" aria-label="Tìm ký tự hoặc mã hex" placeholder="Ký tự / hex"></label></div>
<div class="matrix-wrap"><div id="glyph-grid" class="glyph-grid" aria-label="Bảng hex, hàng và cột từ 0 đến F"></div></div>
<div class="palette-bottom"><span id="shown"></span><span id="glyph-info">Chạm ký tự để chèn</span></div>
<details id="reference-panel" class="reference-panel">
<summary><span>Hex &amp; công thức</span><span id="reference-selected">41 · A</span></summary>
<div class="reference-heading"><div id="reference-glyph" aria-hidden="true"></div><div><strong id="reference-title"></strong><div id="reference-token" class="reference-token"></div></div><a id="reference-source" href="reference/all.pdf" target="_blank" rel="noopener">PDF ↗</a></div>
<dl class="formula-list"><dt>Công thức 1</dt><dd id="formula-one"></dd><dt>Công thức 2</dt><dd id="formula-two"></dd></dl>
<div id="reference-note" class="reference-note"></div>
<div class="reference-actions"><button id="copy-formulas" class="text-button">Sao chép công thức</button><a href="all-hex.json" download>Bảng JSON ↓</a></div>
</details>
</section>
<section id="guide-section" class="guide-section card" aria-label="Hướng dẫn nút bấm">
<div class="guide-top"><h2>Nút bấm</h2><div class="guide-actions"><label class="font-control" for="key-font-size">Cỡ chữ <select id="key-font-size"><option value="16">16px</option><option value="18" selected>18px</option><option value="20">20px</option><option value="22">22px</option></select></label><label class="toggle"><input id="compact" type="checkbox" checked> Gộp nút</label><button id="copy-all" class="secondary" disabled>Sao chép</button><button id="download" class="secondary" disabled>TXT ↓</button></div><span id="guide-progress" class="guide-progress" aria-hidden="true"></span></div>
<div class="guide-scroll" id="guide-scroll"><div id="guide-placeholder" class="guide-placeholder">Nhấn “Tạo hướng dẫn” để xem gán biến và nút bấm.</div><div id="guide" hidden></div></div>
</section>
</main><div id="toast" role="status" class="toast" hidden></div>
</body></html>
